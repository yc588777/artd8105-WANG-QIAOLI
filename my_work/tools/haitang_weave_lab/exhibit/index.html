  .turn { display: none; position: fixed; inset: 0; z-index: 5; background: var(--paper); align-items: center; justify-content: center; text-align: center; }
  .turn b { display: block; font-size: 28px; margin-bottom: 8px; }
  @media (orientation: portrait) and (max-width: 900px) { .turn { display: flex; } .app { display: none; } }
  .app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 18px 8px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; gap: 12px; align-items: center; }
  .seal { width: 40px; height: 40px; border: 1px solid var(--seal); color: var(--seal); display: grid; place-items: center; font-family: "Songti TC", "Noto Serif TC", serif; }
  .brand h1 { margin: 0; font-family: "Songti TC", "Noto Serif TC", serif; font-size: 26px; font-weight: 600; letter-spacing: 0.08em; }
  .brand p { margin: 2px 0 0; color: var(--muted); letter-spacing: 0.18em; font-size: 11px; }
  .top-actions { display: flex; align-items: center; gap: 12px; }
  .lang, .nav { display: flex; gap: 6px; }
  .lang button, .nav button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; min-height: 36px; }
  .lang button.on, .nav button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .session { border-bottom: 1px solid var(--line); background: var(--paper-2); padding: 6px 18px; font-size: 13px; color: var(--muted); }
  .workspace { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .panel { padding: 12px 14px 20px; overflow: auto; border-right: 1px solid var(--line); }
  .step h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.14em; font-weight: 600; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper-2); min-height: 44px; }
  .card strong { font-family: "Songti TC", "Noto Serif TC", serif; font-size: 16px; }
  .card.on { border-color: var(--celadon); box-shadow: inset 0 0 0 1px var(--celadon); background: var(--celadon-2); }
  .blurb { color: #3c362f; font-size: 13px; line-height: 1.55; margin: 10px 0 14px; }
  .slider { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 8px; margin: 10px 0; font-size: 13px; }
  .slider input[type="range"] { grid-column: 1 / -1; accent-color: var(--celadon); height: 28px; }
  .slider .num { width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: white; text-align: right; }
  .slider em { font-style: normal; color: var(--muted); font-size: 12px; }
  .slider small { grid-column: 1 / 2; color: var(--muted); font-size: 11px; line-height: 1.4; }
  .textish { border: 0; background: transparent; color: var(--gold); padding: 0; font-size: 12px; }
  .stage, .viewcol { padding: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px; min-width: 0; min-height: 0; }
  .viewcol { border-left: 1px solid var(--line); }
  .pane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pane-head strong, .mode-toggle button { font-size: 13px; }
  .pane-head span { color: var(--muted); font-size: 12px; }
  .mode-toggle { display: inline-flex; gap: 4px; }
  .mode-toggle button { border: 1px solid var(--line); background: white; border-radius: 8px; padding: 2px 10px; }
  .mode-toggle button.on { background: var(--celadon); color: white; border-color: var(--celadon); }
  .frame { background: #f7f3ec; border: 1px solid var(--line); border-radius: 16px; min-height: 0; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .hint { position: absolute; left: 12px; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: rgba(251,247,241,.9); padding: 6px 8px; border-radius: 8px; }
  .page { font-size: 14px; line-height: 1.65; }
  .page h2 { font-family: "Songti TC", "Noto Serif TC", serif; font-size: 18px; }
  .primary, .ghost { border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); background: white; min-height: 40px; }
  .primary { background: var(--celadon); color: white; border-color: var(--celadon); }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .stat { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .hidden { display: none; }

        const x = CENTER[0] + Math.cos(a) * r;
        const y = CENTER[1] + Math.sin(a) * r;
        if (!inside(INNER, x, y)) { if (r > 8) break; else continue; }
        run.push({ x, y, s: r });
      }
      pushRun(strips, 0, i, width, run);
    }
    const rings = Math.round(v.ring_count);
    for (let k = 1; k <= rings; k++) {
      const rr = 8 + k * (62 / (rings + 0.5)) / Math.max(0.7, v.density);
      const run = [];
      let s = 0, prev = null;
      for (let d = 0; d <= 360; d += 2.5) {
        const th = d * Math.PI / 180;
        const x = CENTER[0] + Math.cos(th) * rr;
        const y = CENTER[1] + Math.sin(th) * rr;
        if (prev) s += Math.hypot(x - prev.x, y - prev.y);
        if (inside(INNER, x, y)) run.push({ x, y, s });
        else { pushRun(strips, 1, k, width * 0.9, run); run.length = 0; }
        prev = { x, y };
      }
      pushRun(strips, 1, k, width * 0.9, run);
    }
  } else if (state.pattern === "ripple") {
    const spacing = 9.2 / v.density;
    addFamily(strips, 0, 0, spacing, v.strand_width_u, v.amplitude, 0);
    addFamily(strips, 1, 90, spacing, v.strand_width_u * 0.9, v.amplitude * 0.85, v.wave_phase);
  } else {
    const spacing = 8.4 / v.density;
    const width = v.strand_width_u;
    const arc = (v.cell_aspect - 1) * 10;
    const jitter = v.randomness * 0.55;
    addFamily(strips, 0, 8, spacing, width, arc, jitter);
    addFamily(strips, 1, 68, spacing, width, arc * 0.6, jitter);
    addFamily(strips, 2, 128, spacing, width * 0.92, arc * 0.4, jitter);
  }
  return strips;
}
function tangent(strip, s) {
  let prev = strip.pts[0], next = strip.pts[strip.pts.length - 1];
  for (let i = 1; i < strip.pts.length; i++) if (strip.pts[i].s >= s) { prev = strip.pts[i - 1]; next = strip.pts[i]; break; }
  const dx = next.x - prev.x, dy = next.y - prev.y, len = Math.hypot(dx, dy) || 1;
  return { x: dx / len, y: dy / len };
}
function markCrossings(strips) {
  const cell = 6;
  const buckets = new Map();
  for (const strip of strips) for (const p of strip.pts) {
    const k = `${Math.floor(p.x / cell)},${Math.floor(p.y / cell)}`;
    let bin = buckets.get(k);
    if (!bin) buckets.set(k, bin = []);
    bin.push({ strip, p });
  }
  const best = new Map();
  for (const strip of strips) for (const p of strip.pts) {
    const i = Math.floor(p.x / cell), j = Math.floor(p.y / cell);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const bin = buckets.get(`${i + a},${j + b}`);
      if (!bin) continue;
      for (const other of bin) {
        if (other.strip.family === strip.family) continue;
        const dx = p.x - other.p.x, dy = p.y - other.p.y, d2 = dx * dx + dy * dy;
        const lim = (strip.width + other.strip.width) * 0.45;
        if (d2 > lim * lim) continue;
        const ka = `${strip.family}:${strip.index}`, kb = `${other.strip.family}:${other.strip.index}`;
        const key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
        const hit = best.get(key);
        if (!hit || d2 < hit.d2) best.set(key, { d2, a: strip, b: other.strip, sa: p.s, sb: other.p.s, x: (p.x + other.p.x) / 2, y: (p.y + other.p.y) / 2 });
      }
    }
  }
  const crossings = [];
  for (const hit of best.values()) {
    const left = hit.a.family < hit.b.family ? hit.a : hit.b;
    const right = left === hit.a ? hit.b : hit.a;
    const leftOver = (left.index + right.index) % 2 === 0;
    const over = leftOver ? left : right;
    const under = leftOver ? right : left;
    const sOver = over === hit.a ? hit.sa : hit.sb;
    const sUnder = under === hit.a ? hit.sa : hit.sb;
    over.overs.push({ s: sOver, half: under.width });
    crossings.push({ x: hit.x, y: hit.y, over, under, sOver, sUnder, overDir: tangent(over, sOver), underDir: tangent(under, sUnder) });
  }
  return crossings;
}
function liftAt(strip, s) {
  let z = 0;
  const lift = state.values.relief || 1.2;
  for (const over of strip.overs) {
    const d = Math.abs(s - over.s);
    const reach = over.half * 2.4;
    if (d < reach) z = Math.max(z, Math.cos((d / reach) * Math.PI / 2) * lift * 2.4);
  }
  return z;
}
function rebuild() {
  const strips = buildStrips();
  const crossings = markCrossings(strips);
  model = { strips, crossings };
  const height = state.values.target_height || 180;
  const width = (114 * height / 180);
  $("planMeta").textContent = `${t("continuity")} · ${width.toFixed(1)} × ${height.toFixed(0)} mm`;
  $("viewMeta").textContent = `${t("drag")} · ${model.strips.length} 篾 · ${model.crossings.length} 交點`;
  paint();
}

function fit(canvas) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const scale = Math.min((w - 28) / 124, (h - 24) / 196);
  return { w, h, scale, ox: w / 2, oy: h * 0.95 };
}
function worldTo(f, x, y) { return [f.ox + x * f.scale, f.oy - y * f.scale]; }
function camera(x, y, z) {
  const cy = Math.cos(state.pitch), sy = Math.sin(state.pitch), cz = Math.cos(state.yaw), sz = Math.sin(state.yaw);
  const x1 = x * cz + z * sz;
  const z1 = -x * sz + z * cz;
  return [x1, y * cy + z1 * sy, z1];
}
function strokeRun(ctx, f, run, width, color, zed) {
  if (run.length < 2) return;
  ctx.beginPath();
  run.forEach((p, i) => {
    const q = worldTo(f, p.x, p.y);
    if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
  });
  ctx.lineCap = "butt";
  ctx.lineJoin = "round";
  if (color !== OPENING) {
    ctx.strokeStyle = darken(color);
    ctx.lineWidth = width * f.scale + 0.8;
    ctx.stroke();
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, width * f.scale);
  ctx.stroke();
}
function pathOf(ctx, f, poly, project) {
  ctx.beginPath();
  poly.forEach((p, i) => {
    const q = project(f, p[0], p[1], 0);
    if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
  });
  ctx.closePath();
}
function paintPlan(canvas) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, canvas.clientWidth * dpr);
  canvas.height = Math.max(1, canvas.clientHeight * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const f = fit(canvas);
  ctx.fillStyle = "#f7f3ec";
  ctx.fillRect(0, 0, f.w, f.h);
  pathOf(ctx, f, OUTER, worldTo);
  ctx.fillStyle = RIM;
  ctx.fill();
  pathOf(ctx, f, INNER, worldTo);
  ctx.fillStyle = OPENING;
  ctx.fill();
  ctx.save();
  pathOf(ctx, f, INNER, worldTo);
  ctx.clip();
  for (const strip of model.strips) {
    const color = state.selected === strip ? "#2c6b66" : strip.color;
    strokeRun(ctx, f, strip.pts, strip.width, color, false);
  }
  if (state.mode === "cross") {
    for (const hit of model.crossings) {
      const cut = hit.over.width * 0.52;
      strokeRun(ctx, f, [
        { x: hit.x - hit.underDir.x * cut, y: hit.y - hit.underDir.y * cut },
        { x: hit.x + hit.underDir.x * cut, y: hit.y + hit.underDir.y * cut }
      ], hit.under.width + 0.35, OPENING, false);
      const span = hit.under.width * 0.85;
      strokeRun(ctx, f, [
        { x: hit.x - hit.overDir.x * span, y: hit.y - hit.overDir.y * span },
        { x: hit.x + hit.overDir.x * span, y: hit.y + hit.overDir.y * span }
      ], hit.over.width, hit.over.color, false);
    }
  }
  ctx.restore();
}
function paintSolid(canvas) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, canvas.clientWidth * dpr);
  canvas.height = Math.max(1, canvas.clientHeight * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.fillStyle = "#f7f3ec";
  ctx.fillRect(0, 0, w, h);
  const samples = OUTER.map((p) => camera(p[0], p[1], 0));
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of samples) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  const scale = Math.min((w - 36) / (maxX - minX || 1), (h - 28) / (maxY - minY || 1));
  const ox = w / 2 - ((minX + maxX) / 2) * scale;
  const oy = h / 2 + ((minY + maxY) / 2) * scale;
  const map = (x, y, z) => { const p = camera(x, y, z || 0); return [ox + p[0] * scale, oy - p[1] * scale, p[2]]; };
  const pieces = [];
  const addLine = (pts, color, width) => {
    const proj = pts.map((p) => map(p.x, p.y, p.z || 0));
    pieces.push({ proj, color, width, depth: proj.reduce((s, p) => s + p[2], 0) / proj.length, poly: false });
  };
  pieces.push({ proj: OUTER.map((p) => map(p[0], p[1], 0)), color: RIM, width: 0, depth: 40, poly: true });
  pieces.push({ proj: INNER.map((p) => map(p[0], p[1], 0.4)), color: OPENING, width: 0, depth: 8, poly: true });
  for (const strip of model.strips) addLine(strip.pts.map((p) => ({ x: p.x, y: p.y, z: 0.8 + liftAt(strip, p.s) })), strip.color, strip.width);
  pieces.sort((a, b) => b.depth - a.depth);
  for (const piece of pieces) {
    ctx.beginPath();
    piece.proj.forEach((p, i) => { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    if (piece.poly) { ctx.closePath(); ctx.fillStyle = piece.color; ctx.fill(); }
    else {
      ctx.lineCap = "butt"; ctx.lineJoin = "round";
      ctx.strokeStyle = darken(piece.color);
      ctx.lineWidth = piece.width * scale + 0.7;
      ctx.stroke();
      ctx.strokeStyle = piece.color;
      ctx.lineWidth = Math.max(0.8, piece.width * scale);
      ctx.stroke();
    }
  }
}
function paint() { if (!model) return; paintPlan($("plan")); paintSolid($("solid")); }

function rowLabel(row) { return state.lang === "en" ? row[2] : row[1]; }
function rowHint(row) { return state.lang === "en" ? row[8] : row[7]; }
function renderChrome() {
  $("session").textContent = t("session");
  $("turnTitle").textContent = t("turn");
  $("turnSub").textContent = t("turnSub");
  $("modePlan").textContent = t("plan");
  $("modeCross").textContent = t("cross");
  $("modePlan").classList.toggle("on", state.mode === "plan");
  $("modeCross").classList.toggle("on", state.mode === "cross");
  $("viewTitle").textContent = t("view");
  $("planHint").textContent = state.pick ? t("picked").replace("{n}", state.pick.crossings).replace("{a}", state.pick.over).replace("{b}", state.pick.under) : t("hint");
  $("zh").classList.toggle("on", state.lang !== "en");
  $("en").classList.toggle("on", state.lang === "en");
  $("nav").innerHTML = ["design", "size", "exp", "lib", "help"].map((id) => `<button type="button" data-tab="${id}" class="${state.tab === id ? "active" : ""}">${t(id)}</button>`).join("");
  const design = state.tab === "design";
  $("panel").innerHTML = design ? designPanel() : otherPanel();
  const show = state.tab === "design";
  document.querySelector(".stage").classList.toggle("hidden", !show);
  document.querySelector(".viewcol").classList.toggle("hidden", !show);
  document.querySelector(".workspace").style.gridTemplateColumns = show ? "300px minmax(0,1fr) minmax(0,1fr)" : "minmax(0,1fr)";
  bindPanel();
}
function designPanel() {
  const cards = PATTERNS.map((item) => `<button type="button" class="card ${item.id === state.pattern ? "on" : ""}" data-pattern="${item.id}"><strong>${state.lang === "en" ? item.en : item.zh}</strong></button>`).join("");
  const rows = ROWS[state.pattern].map((row) => {
    const value = state.values[row[0]];
    const shown = row[5] < 1 ? Number(value).toFixed(2) : Math.round(value);
    return `<label class="slider"><span>${rowLabel(row)}</span><input class="num" data-key="${row[0]}" type="number" min="${row[3]}" max="${row[4]}" step="${row[5]}" value="${shown}"><em>${row[6]}</em><input data-key="${row[0]}" type="range" min="${row[3]}" max="${row[4]}" step="${row[5]}" value="${value}"><small>${rowHint(row)}</small><button type="button" class="textish" data-reset="${row[0]}">${t("reset")}</button></label>`;
  }).join("");
  return `<div class="step"><h2>${t("pattern")}</h2><div class="cards">${cards}</div><p class="blurb">${t("blurb")}</p></div><div class="step"><h2>${t("adjust")}</h2>${rows}</div>`;
}
function otherPanel() {
  if (state.tab === "size") return `<article class="page"><h2>${t("sizeTitle")}</h2><p>${t("sizeP")}</p><div class="stat"><span>114 × 180 mm</span><b>${t("continuity")}</b></div></article>`;
  if (state.tab === "exp") return `<article class="page"><h2>${t("expTitle")}</h2><p>${t("expP")}</p><button class="primary" id="savePng">${t("expBtn")}</button></article>`;
  if (state.tab === "lib") {
    const saved = JSON.parse(localStorage.getItem("haitang-tablet-schemes") || "[]");
    const list = saved.map((item, i) => `<div class="stat"><button class="ghost" data-load="${i}">${item.name}</button><button class="ghost" data-del="${i}">${t("libDel")}</button></div>`).join("");
    return `<article class="page"><h2>${t("libTitle")}</h2><div class="row"><button class="primary" id="saveScheme">${t("libSave")}</button></div>${list || `<p>${t("libEmpty")}</p>`}</article>`;
  }
  return `<article class="page"><h2>${t("helpTitle")}</h2><p>${t("helpP")}</p></article>`;
}
function bindPanel() {
  $("panel").onclick = (event) => {
    const pattern = event.target.closest("[data-pattern]");
    if (pattern) { state.pattern = pattern.dataset.pattern; state.values = { ...defaults(state.pattern), ...state.values, ...defaults(state.pattern) }; state.pick = null; renderChrome(); rebuild(); return; }
    const reset = event.target.closest("[data-reset]");
    if (reset) { state.values[reset.dataset.reset] = defaults(state.pattern)[reset.dataset.reset]; renderChrome(); rebuild(); return; }
    const load = event.target.closest("[data-load]");
    const del = event.target.closest("[data-del]");
    if (load || del) {
      const saved = JSON.parse(localStorage.getItem("haitang-tablet-schemes") || "[]");
      const index = Number((load || del).dataset.load || (load || del).dataset.del);
      if (load) { state.pattern = saved[index].pattern; state.values = saved[index].values; state.tab = "design"; renderChrome(); rebuild(); }
      else { saved.splice(index, 1); localStorage.setItem("haitang-tablet-schemes", JSON.stringify(saved)); renderChrome(); }
    }
  };
  $("panel").oninput = (event) => {
    const key = event.target.dataset.key;
    if (!key) return;
    state.values[key] = Number(event.target.value);
    const shown = ROWS[state.pattern].find((row) => row[0] === key)[5] < 1 ? state.values[key].toFixed(2) : String(Math.round(state.values[key]));
    for (const input of $("panel").querySelectorAll(`[data-key="${key}"]`)) if (input !== event.target) input.value = input.type === "number" ? shown : state.values[key];
    rebuild();
  };
  const save = $("saveScheme");
  if (save) save.onclick = () => {
    const saved = JSON.parse(localStorage.getItem("haitang-tablet-schemes") || "[]");
    const name = (state.lang === "en" ? PATTERNS.find((item) => item.id === state.pattern).en : PATTERNS.find((item) => item.id === state.pattern).zh) + " " + (saved.length + 1);
    saved.push({ name, pattern: state.pattern, values: { ...state.values } });
    localStorage.setItem("haitang-tablet-schemes", JSON.stringify(saved));
    renderChrome();
  };
  const png = $("savePng");
  if (png) png.onclick = () => {
    const link = document.createElement("a");
    link.href = $("plan").toDataURL("image/png");
    link.download = "haitang-plan.png";
    link.click();
  };
}
function nearestStrip(x, y) {
  let best = null, dist = 3.2;
  for (const strip of model.strips) for (const p of strip.pts) {
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < dist) { dist = d; best = strip; }
  }
  return best;
}
function bind() {
  $("zh").onclick = () => { state.lang = "zh-Hant"; renderChrome(); rebuild(); };
  $("en").onclick = () => { state.lang = "en"; renderChrome(); rebuild(); };
  $("nav").onclick = (event) => { const tab = event.target.dataset.tab; if (!tab) return; state.tab = tab; renderChrome(); if (tab === "design") paint(); };
  $("modePlan").onclick = () => { state.mode = "plan"; renderChrome(); paint(); };
  $("modeCross").onclick = () => { state.mode = "cross"; renderChrome(); paint(); };
  const plan = $("plan");
  plan.addEventListener("pointerdown", (event) => {
    const rect = plan.getBoundingClientRect();
    const f = fit(plan);
    const x = (event.clientX - rect.left - f.ox) / f.scale;
    const y = (f.oy - (event.clientY - rect.top)) / f.scale;
    const strip = nearestStrip(x, y);
    if (!strip) { state.pick = null; state.selected = null; }
    else {
      const mine = model.crossings.filter((hit) => hit.over === strip || hit.under === strip);
      state.selected = strip;
      state.pick = { crossings: mine.length, over: mine.filter((hit) => hit.over === strip).length, under: mine.filter((hit) => hit.under === strip).length };
    }
    renderChrome();
    paint();
  });
  const solid = $("solid");
  solid.addEventListener("pointerdown", (event) => { dragging = { x: event.clientX, y: event.clientY, yaw: state.yaw, pitch: state.pitch, id: event.pointerId }; solid.setPointerCapture(event.pointerId); });
  solid.addEventListener("pointermove", (event) => {
    if (!dragging || dragging.id !== event.pointerId) return;
    state.yaw = dragging.yaw + (event.clientX - dragging.x) * 0.008;
    state.pitch = Math.max(0.35, Math.min(1.35, dragging.pitch + (event.clientY - dragging.y) * 0.005));
    paint();
  });
  solid.addEventListener("pointerup", () => { dragging = null; });
  window.addEventListener("resize", paint);
}
renderChrome();
bind();
bindPanel();
rebuild();
</script>
</body>
